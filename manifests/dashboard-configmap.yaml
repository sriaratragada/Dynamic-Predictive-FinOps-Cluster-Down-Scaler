apiVersion: v1
kind: ConfigMap
metadata:
  name: finops-dashboard-config
  namespace: kube-system
  labels:
    app.kubernetes.io/name: finops-dashboard
data:
  CLOUD_PROVIDER: "aws"
  NODE_INSTANCE_TYPE: "m5.xlarge"
  NODE_HOURLY_COST: "0.192"
  AWS_REGION: "us-east-1"
  PROMETHEUS_URL: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
  STATE_CONFIGMAP_NAME: "finops-scaler-state"
  STATE_CONFIGMAP_NS: "kube-system"
  SAVINGS_CONFIGMAP_NAME: "finops-savings-state"
  DASHBOARD_PORT: "8090"
  CORS_ORIGINS: "*"
