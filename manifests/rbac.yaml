apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-scaler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: finops-scaler
rules:
  # Deployments — list eligible, patch scale
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]

  # Nodes — cordon (patch unschedulable) and list for metrics fallback
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]

  # Pods — needed for drain enumeration
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Pod eviction (drain)
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]

  # PodDisruptionBudgets — read to understand eviction blocks
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]

  # ConfigMaps — state store (finops-scaler-state in kube-system)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]

  # Namespaces — read to discover opt-in annotation (auto-labeller)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]

  # HPAs — suspend/resume minReplicas during scale-down windows
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "patch", "update"]

  # Kubernetes Events — emit scale/cordon events visible via kubectl get events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Leader election — Lease in coordination.k8s.io/v1
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: finops-scaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: finops-scaler
subjects:
  - kind: ServiceAccount
    name: finops-scaler
    namespace: kube-system
