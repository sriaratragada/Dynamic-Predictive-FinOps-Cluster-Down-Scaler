apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-dashboard
  namespace: kube-system
  labels:
    app.kubernetes.io/name: finops-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finops-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finops-dashboard
    spec:
      serviceAccountName: finops-dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: dashboard
          image: finops-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          envFrom:
            - configMapRef:
                name: finops-dashboard-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
