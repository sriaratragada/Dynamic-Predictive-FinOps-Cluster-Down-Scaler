image:
  repository: finops-scaler
  tag: latest
  pullPolicy: IfNotPresent

# Number of controller replicas.  Set to 2+ with enableLeaderElection=true for HA.
replicaCount: 1

# Namespace for all chart resources
namespace: kube-system

config:
  # Prometheus endpoint reachable from inside the cluster
  prometheusUrl: "http://prometheus-operated.monitoring.svc.cluster.local:9090"

  # Schedule (24-hour HH:MM in the configured timezone)
  businessHoursStart: "07:00"
  businessHoursEnd: "19:00"

  # Comma-separated weekday numbers: 0=Mon … 6=Sun
  businessDays: "0,1,2,3,4"

  # Scale-up begins this many minutes before the active window starts
  prewarmMinutes: "15"

  # Control-loop interval in seconds
  loopIntervalSeconds: "60"

  # Restrict scaledown to one namespace; leave empty for all namespaces
  namespaceFilter: ""

  # Minimum replicas to leave running during off-hours (0 = scale to zero)
  minReplicaFloor: "0"

  # Cordon nodes whose CPU usage is below this fraction of allocatable capacity
  nodeUtilisationThreshold: "0.10"

  # ConfigMap used to persist replica counts across controller restarts
  stateConfigmapName: "finops-scaler-state"
  stateConfigmapNs: "kube-system"

  # IANA timezone name (e.g. America/New_York, Europe/London)
  timezone: "UTC"

  # Set to "true" to allow Prometheus to override the schedule on quiet days
  enableMetricOverride: "false"

  # Set to "true" to log actions without modifying any resources
  dryRun: "false"

  # Port the controller exposes its own /metrics endpoint on
  metricsPort: "8080"

  # Prophet ML predictor (optional — requires requirements-prophet.txt)
  enableProphet: "false"
  prophetTrainingWeeks: "4"
  prophetIdleThresholdCores: "0.5"
  prophetRetrainHours: "6"

  # Demo / local mode — synthetic data, no cluster required
  demoMode: "false"

  # GPU-aware cordoning (optional — requires nvidia/dcgm-exporter + Prometheus scraping)
  # When "true", nodes with nvidia.com/gpu allocatable use GPU utilisation
  # (DCGM_FI_DEV_GPU_UTIL) as the cordon signal instead of CPU.
  enableGpuAware: "false"

  # Fraction 0.0–1.0 of GPU utilisation below which a GPU node is cordoned
  gpuIdleThreshold: "0.10"

  # HPA suspend/resume — prevents HPAs from fighting the scale-down controller
  enableHpaSuspend: "true"

  # Auto-labeller — label deployments in opt-in namespaces automatically
  # (annotate a namespace with finops.io/scaledown-namespace=true to opt in)
  enableAutoLabel: "false"

  # Kubernetes Events — emit native events visible via kubectl get events
  enableK8sEvents: "true"

  # Webhook — POST Slack-compatible JSON to this URL on every scale event.
  # Example: https://hooks.slack.com/services/...  Leave empty to disable.
  webhookUrl: ""

  # Human-readable cluster name included in webhook payloads
  clusterName: ""

  # Leader election — only one replica executes the loop; set replicaCount=2 for HA
  enableLeaderElection: "true"

  # Lease duration in seconds (renew every ~1/3 of this value)
  leaderLeaseDuration: "30"

  # Pre-flight — run startup validation checks before the control loop
  enablePreflight: "true"

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

# ── Dashboard ──────────────────────────────────────────────────────────────────

dashboard:
  image:
    repository: finops-dashboard
    tag: latest
    pullPolicy: IfNotPresent

  # Port the dashboard listens on (inside the container)
  port: 8090

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  config:
    # Connection
    prometheusUrl: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
    demoMode: "false"

    # Cloud & Pricing
    cloudProvider: "aws"              # aws | gcp | manual
    nodeInstanceType: "m5.xlarge"
    nodeHourlyCost: "0.192"
    awsRegion: "us-east-1"

    # Savings ConfigMap (written by dashboard, separate from controller state)
    savingsConfigmapName: "finops-savings-state"

    # Dashboard UX
    corsOrigins: "*"
    pollIntervalSeconds: "30"

    # AI Pre-Warm Engine (optional — enable only on high-conversion pages)
    enablePrewarm: "false"

    # Bearer token for PATCH /api/config and POST /api/prewarm.
    # Leave empty to run without authentication (local dev / demo mode).
    # In production, set this to a strong random string:
    #   kubectl create secret generic finops-dashboard-token --from-literal=API_TOKEN=<token>
    # and reference it via envFrom secretRef instead of this configmap value.
    apiToken: ""
