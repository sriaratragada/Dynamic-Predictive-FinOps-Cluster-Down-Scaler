apiVersion: v1
kind: Service
metadata:
  name: {{ include "finops-scaler.dashboard.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "finops-scaler.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    {{- include "finops-scaler.dashboard.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.dashboard.port | int }}
      targetPort: {{ .Values.dashboard.port | int }}
      protocol: TCP
